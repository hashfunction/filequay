name: FileQuay Windows qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/filequay]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.102'
      - name: Qualify native app with temporary CI identity
        shell: pwsh
        run: ./distribution/qualify-windows.ps1
      - name: Preserve qualification metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FileQuay-Windows-qualification
          path: |
            artifacts/qualification/**/*.json
            artifacts/qualification/**/*.txt
            artifacts/qualification/**/*.trx
          retention-days: 14
          if-no-files-found: error
